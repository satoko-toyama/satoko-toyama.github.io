name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 08:17 Asia/Tokyo (GitHub schedules use UTC and may start late).
    - cron: '17 23 * * *'
  workflow_dispatch:

concurrency:
  group: website-deployment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test researchmap synchronization
        run: npm test

      - name: Fetch public researchmap data
        run: npm run sync-researchmap

      - name: Build
        run: npm run build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Save verified researchmap content
        run: |
          git add data/researchmap.json public/api public/content/career public/locales
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update website from public researchmap data'
            git push origin HEAD:main
          fi

      # GITHUB_TOKEN commits do not trigger a second push workflow.
      # Deploy in this same job, only after fetching, testing and building succeed.
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
